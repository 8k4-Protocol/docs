name: OpenAPI alignment

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * *"

jobs:
  check-openapi-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs endpoints against live OpenAPI
        run: python scripts/check_openapi_alignment.py
